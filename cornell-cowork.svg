<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <style>
      .cue-text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 18px; fill: #333; }
      .note-text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 16px; fill: #444; }
      .summary-text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 16px; fill: #555; font-weight: bold; }
      .title-text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 22px; fill: #222; font-weight: bold; }
      .label-text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; font-size: 14px; fill: #888; text-transform: uppercase; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#fefefe"/>

  <!-- 外框線 -->
  <rect x="1" y="1" width="1198" height="898" fill="none" stroke="#ddd" stroke-width="2"/>

  <!-- 左側 Cue 欄背景 -->
  <rect x="1" y="1" width="359" height="719" fill="#e8f4e8"/>

  <!-- 底部 Summary 欄背景 -->
  <rect x="1" y="720" width="1198" height="179" fill="#f5f5f5"/>

  <!-- 標題 -->
  <text x="20" y="40" class="title-text">Claude Cowork 架構圖</text>

  <!-- 左側 Cue 欄標籤 -->
  <text x="20" y="70" class="label-text">CUES</text>

  <!-- 左側 Cue 內容 -->
  <text x="20" y="100" class="cue-text">Plugins（外掛）跟 Skills（技能）有何不同？</text>
  <text x="20" y="100" class="cue-text">Connectors 的作用是什麼？</text>
  <text x="20" y="100" class="cue-text">Sandbox 用在哪？</text>
  <text x="20" y="100" class="cue-text">CLAUDE.md 的用途？</text>
  <text x="20" y="100" class="cue-text">Subagents 與 cronjob 的差別？</text>

  <!-- 右側 Notes 欄標籤 -->
  <text x="380" y="70" class="label-text">NOTES</text>

  <!-- 右側 Notes 內容 -->
  <text x="380" y="100" class="note-text">Claude Cowork 架構核心觀念：不只回答問題，而是執行任務。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Plugins（外掛）：打包好的 skills 與 connectors 的外掛任務工具。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Skills（技能）：標準作業程序 SOP，規範步驟。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Connectors（連接器）：用 API 來連接外部工具。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Subagents &amp; cronjob（子代理與排程）：可訂時平行同步處理。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">CLAUDE.md：專案記憶，行為學習。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Dispatch（分派）：遠端任務指派。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">本地任務執行：非結構化資料轉譯、做投影片。</text>
  <text x="380" y="100" class="note-text"></text>
  <text x="380" y="100" class="note-text">Sandbox（沙盒）：安全隔離區，轉置目錄。</text>

  <!-- 底部 Summary 標籤 -->
  <text x="20" y="750" class="label-text">SUMMARY</text>

  <!-- 底部 Summary 內容 -->
  <text x="20" y="780" class="summary-text">Claude Cowork 是任務執行型 AI 架構，包含 Plugins、Skills、Connectors 等元件，透過 Subagents、Dispatch、Sandbox 等機制達成多元任務處理。</text>

  <!-- 分隔線 -->
  <line x1="360" y1="0" x2="360" y2="720" stroke="#ccc" stroke-width="1"/>
  <line x1="0" y1="720" x2="1200" y2="720" stroke="#ccc" stroke-width="1"/>
</svg>