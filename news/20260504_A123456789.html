<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>undefined</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }
        
        .header .category {
            display: inline-block;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 1rem;
        }
        
        .meta-info {
            background: #f8f9fa;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid #eee;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .meta-item {
            font-size: 0.9rem;
        }
        
        .meta-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 0.3rem;
        }
        
        .content {
            padding: 3rem 2rem;
        }
        
        .content h2 {
            color: #667eea;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }
        
        .news-title {
            font-size: 1.3rem;
            color: #222;
            margin-bottom: 1rem;
            line-height: 1.5;
        }
        
        .news-description {
            color: #555;
            line-height: 1.8;
            margin-bottom: 2rem;
            padding: 1rem;
            background: #f0f3f9;
            border-left: 4px solid #667eea;
        }
        
        .facebook-post {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
            border: 2px dashed #667eea;
        }
        
        .facebook-post h3 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }
        
        .post-content {
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .source-link {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 2px solid #eee;
        }
        
        .source-link a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.3s;
            margin-top: 1rem;
        }
        
        .source-link a:hover {
            background: #764ba2;
        }
        
        .footer {
            background: #f8f9fa;
            padding: 2rem;
            text-align: center;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #666;
        }
        
        .generated-badge {
            display: inline-block;
            background: #e8f1ff;
            color: #667eea;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 1rem;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .meta-info {
                grid-template-columns: 1fr;
            }
            
            .content {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>undefined</h1>
            <span class="category">📰 undefined</span>
        </div>
        
        <div class="meta-info">
            <div class="meta-item">
                <strong>新聞來源</strong>
                undefined
            </div>
            <div class="meta-item">
                <strong>作者</strong>
                undefined
            </div>
            <div class="meta-item">
                <strong>發布時間</strong>
                Invalid Date
            </div>
            <div class="meta-item">
                <strong>內容分類</strong>
                undefined
            </div>
        </div>
        
        <div class="content">
            <h2>📌 新聞摘要</h2>
            <div class="news-description">
                undefined
            </div>
            
            <h2>📱 Facebook 貼文</h2>
            <div class="facebook-post">
                <h3>建議分享內容：</h3>
                <div class="post-content">貼文內容生成失敗</div>
            </div>
            
            <div class="source-link">
                <strong>完整新聞報導：</strong><br>
                <a href="undefined" target="_blank">閱讀完整文章 →</a>
            </div>
        </div>
        
        <div class="footer">
            <p>日報系統自動生成</p>
            <p>生成時間：Invalid Date</p>
            <span class="generated-badge">學號: A123456789</span>
        </div>
    </div>
</body>
</html>
