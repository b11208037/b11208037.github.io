<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Prof. Pin Luarn - Academic Impact Network</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 1000px; margin: auto; }
        h1 { border-bottom: 1px solid #334155; padding-bottom: 20px; color: #38bdf8; }
        #graph { width: 100%; height: 700px; background: #1e293b; border-radius: 12px; }
        .node { stroke: #fff; stroke-width: 1.5px; }
        .link { stroke: #475569; stroke-opacity: 0.6; }
        .label { fill: #cbd5e1; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>學術影響力關聯圖：欒斌 教授</h1>
        <div id="graph"></div>
    </div>
    <script>
        const nodes = [
            {id: "欒斌", group: 1, type: "Prof"},
            {id: "電子商務 (e-Commerce)", group: 2, type: "Topic"},
            {id: "網路行銷 (Internet Marketing)", group: 2, type: "Topic"},
            {id: "社群網路行銷 (Social Network Marketing)", group: 2, type: "Topic"},
            {id: "資訊擴散 (Information Diffusion)", group: 3, type: "Field"},
            {id: "消費者行為", group: 3, type: "Field"},
            {id: "台科大 (NTUST)", group: 4, type: "Affiliation"}
        ];
        const links = [
            {source: "欒斌", target: "電子商務 (e-Commerce)"},
            {source: "欒斌", target: "網路行銷 (Internet Marketing)"},
            {source: "欒斌", target: "社群網路行銷 (Social Network Marketing)"},
            {source: "欒斌", target: "台科大 (NTUST)"},
            {source: "電子商務 (e-Commerce)", target: "資訊擴散 (Information Diffusion)"},
            {source: "網路行銷 (Internet Marketing)", target: "消費者行為"},
            {source: "社群網路行銷 (Social Network Marketing)", target: "資訊擴散 (Information Diffusion)"}
        ];

        const width = 1000, height = 700;
        const svg = d3.select("#graph").append("svg").attr("width", width).attr("height", height);
        const simulation = d3.forceSimulation(nodes)
            .force("link", d3.forceLink(links).id(d => d.id).distance(150))
            .force("charge", d3.forceManyBody().strength(-500))
            .force("center", d3.forceCenter(width / 2, height / 2));

        const link = svg.append("g").selectAll("line").data(links).enter().append("line").attr("class", "link");
        const node = svg.append("g").selectAll("circle").data(nodes).enter().append("circle").attr("class", "node").attr("r", 15).style("fill", d => d.group === 1 ? "#38bdf8" : "#fb7185")
            .call(d3.drag().on("start", (e, d) => { if (!e.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; }).on("end", (e, d) => { if (!e.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));
        
        const label = svg.append("g").selectAll("text").data(nodes).enter().append("text").attr("class", "label").text(d => d.id).attr("dx", 18).attr("dy", 4);

        simulation.on("tick", () => {
            link.attr("x1", d => d.source.x).attr("y1", d => d.source.y).attr("x2", d => d.target.x).attr("y2", d => d.target.y);
            node.attr("cx", d => d.x).attr("cy", d => d.y);
            label.attr("x", d => d.x).attr("y", d => d.y);
        });
    </script>
</body>
</html>
